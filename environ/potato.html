<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag, drop, check</title>
    <link rel="stylesheet" href="potato.css">
    <script src="jquery-3.7.1.min.js"></script>
    <script src="potato.js" defer></script>
</head>
<body>
    <p>Water the Potato please</p>
    <div id="items">
        <div id="item-a" class="item" draggable="true">Watering can</div>
        <div id="item-b" class="item" draggable="true">rake</div>
    </div>
    <div id="target">this is potato</div>
    <p id="result" aria-live="polite">The potato is unwatered</p>
</body>
</html>
